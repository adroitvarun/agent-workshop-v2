[project]
name = "ai-agents-workshop-2026"
version = "1.0.0"
description = "A 4-day, hands-on workshop on building AI agents"
requires-python = ">=3.10"
dependencies = [
    "agno[mcp,sqlite]==3.1.12",
    "mcp>=2.3.0",
    "openai>=3.45.0",
    "openinference-instrumentation-agno>=1.1.0",
    "opentelemetry-sdk>=1.45.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
bonus = ["chromadb", "pypdf"]
gemini = ["google-genai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campus_buddy"]
